name: CI

on:
  pull_request:
    branches:
      - master
      - docs/week1-e01-review
      - feature/week1-e02-postgres
      - feature/week1-e05-app-shell
      - feature/week1-e06-sessions
      - feature/week1-e03-request-protection
      - chore/week1-e04-quality-gates
      - feature/week1-s01-register
      - feature/week1-s02-login
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notenest
          POSTGRES_PASSWORD: notenest_ci
          POSTGRES_DB: notenest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notenest -d notenest_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://notenest:notenest_ci@127.0.0.1:5432/notenest_test
      SESSION_SECRET: E04-ci-browser-secret-at-least-thirty-two-characters
      APP_ORIGIN: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/verify.sh
