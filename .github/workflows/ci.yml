name: CI

on:
  pull_request:
    branches:
      - master
      - docs/week1-e01-review
      - feature/week1-e02-postgres
      - feature/week1-e05-app-shell
      - feature/week1-e06-sessions
      - feature/week1-e03-request-protection
      - chore/week1-e04-quality-gates
      - feature/week1-s01-register
      - feature/week1-s02-login
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
