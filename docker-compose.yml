name: notenest

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: notenest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: notenest
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notenest -d notenest']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://notenest:${POSTGRES_PASSWORD}@db:5432/notenest?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      HOST: 0.0.0.0
      NODE_ENV: development
      PORT: 3000
      APP_ORIGIN: http://127.0.0.1:${APP_PORT:-3000}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
